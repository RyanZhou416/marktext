<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>MarkText</title>
    <link rel="stylesheet" href="./loading.css">
  </head>
  <body autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false">
    <!-- Vue app -->
    <script>
      // Ensure process.env exists before any polyfills/modules try to access it
      // (e.g. util.js reads process.env.NODE_DEBUG at import time)
      if (typeof globalThis.process === 'undefined') {
        globalThis.process = { env: {}, versions: {}, platform: 'win32', cwd: function() { return '/'; } };
      } else if (!globalThis.process.env) {
        globalThis.process.env = {};
      }
      if (typeof global === 'undefined') {
        window.global = window;
      }

      // Shim require for UMD modules that check for it in the browser environment
      if (typeof window.require === 'undefined') {
        window.require = function(moduleName) {
          // Return empty object for any module to prevent crashes in browser context
          return {};
        }
      }
    </script>
    <div id="app"></div>

    <!-- Loading page on application startup -->
    <div id="loading-page">
      <div class="spinner">
        <div class="double-bounce1 dot"></div>
        <div class="double-bounce2 dot"></div>
      </div>
    </div>

    <script>
      const params = new URLSearchParams(window.location.search)
      const THEMES_COLOR = {
        'one-dark': 'rgba(77, 120, 204, 1)',
        'dark': '#409eff',
        'graphite': 'rgb(104, 134, 170)',
        'material-dark': '#f48237',
        'light': 'rgba(33, 181, 111, 1)',
        'ulysses': 'rgb(12, 139, 186)'
      }

      const dots = document.querySelectorAll('.dot')
      Array.from(dots).forEach(dot => {
        dot.style.background = THEMES_COLOR[params.get('theme')] || 'rgba(33, 181, 111, 1)'
      })
    </script>

    <script type="module" src="./main.ts"></script>
  </body>
</html>
