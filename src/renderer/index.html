<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>MarkText</title>
    <style>
      html, body {
        margin: 0;
        padding: 0;
      }

      #loading-page {
        position: absolute;
        background: transparent;
        -webkit-app-region: drag;
        left: 0;
        right: 0;
        top: 0;
        bottom: 0;
      }

      .spinner {
        width: 40px;
        height: 40px;
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translateX(-50%) translateY(-50%);
      }

      .double-bounce1, .double-bounce2 {
        width: 100%;
        height: 100%;
        border-radius: 50%;
        opacity: 0.4;
        position: absolute;
        top: 0;
        left: 0;

        -webkit-animation: sk-bounce 2.0s infinite ease-in-out;
        animation: sk-bounce 2.0s infinite ease-in-out;
      }

      .double-bounce2 {
        -webkit-animation-delay: -1.0s;
        animation-delay: -1.0s;
      }

      @-webkit-keyframes sk-bounce {
        0%, 100% { -webkit-transform: scale(0.0) }
        50% { -webkit-transform: scale(1.0) }
      }

      @keyframes sk-bounce {
        0%, 100% {
          transform: scale(0.0);
          -webkit-transform: scale(0.0);
        } 50% {
          transform: scale(1.0);
          -webkit-transform: scale(1.0);
        }
      }
    </style>
  </head>
  <body autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false">
    <!-- Vue app -->
    <script>
      // Shim require for UMD modules that check for it
      if (typeof window.require === 'undefined') {
        window.require = function(moduleName) {
          console.warn('Runtime require called for:', moduleName);
          // Return empty object for Node.js built-ins and common modules to prevent crash
          var safeModules = [
            'fs', 'fs-extra', 'fs/promises', 'path', 'os', 'child_process',
            'electron', 'electron-log', 'encoding', 'crypto', 'stream', 'util',
            'buffer', 'events', 'net', 'http', 'https', 'url', 'querystring',
            'assert', 'zlib'
          ];
          if (safeModules.includes(moduleName)) {
            return {};
          }
          throw new Error("Cannot find module '" + moduleName + "'");
        }
      }
    </script>
    <div id="app"></div>

    <!-- Loading page on application startup -->
    <div id="loading-page">
      <div class="spinner">
        <div class="double-bounce1 dot"></div>
        <div class="double-bounce2 dot"></div>
      </div>
    </div>

    <script>
      const params = new URLSearchParams(window.location.search)
      const THEMES_COLOR = {
        'one-dark': 'rgba(77, 120, 204, 1)',
        'dark': '#409eff',
        'graphite': 'rgb(104, 134, 170)',
        'material-dark': '#f48237',
        'light': 'rgba(33, 181, 111, 1)',
        'ulysses': 'rgb(12, 139, 186)'
      }

      const dots = document.querySelectorAll('.dot')
      Array.from(dots).forEach(dot => {
        dot.style.background = THEMES_COLOR[params.get('theme')] || 'rgba(33, 181, 111, 1)'
      })
    </script>

    <script type="module" src="./main.js"></script>
  </body>
</html>
