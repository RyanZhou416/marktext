[package]
name = "marktext"
version = "0.17.1"
description = "Next generation markdown editor"
authors = ["MarkText Team"]
license = "MIT"
repository = "https://github.com/marktext/marktext"
edition = "2021"

[lib]
name = "marktext_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-fs = "2"
tauri-plugin-window-state = "2"
tauri-plugin-process = "2"
tauri-plugin-os = "2"

# Font enumeration
font-kit = "0.14"

# File watching
notify = "7"

# Async runtime
tokio = { version = "1", features = ["full"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Error handling
thiserror = "2"
anyhow = "1"

# System info
hostname = "0.4"
dirs = "5"

# URL encoding
urlencoding = "2"

# Logging
log = "0.4"
env_logger = "0.11"

# Platform-specific
[target.'cfg(windows)'.dependencies]
winapi = { version = "0.3", features = ["winuser"] }

[features]
default = []
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
