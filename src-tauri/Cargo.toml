[package]
name = "marktext"
version = "0.17.1"
description = "Next generation markdown editor"
authors = ["MarkText Team"]
license = "MIT"
repository = "https://github.com/marktext/marktext"
edition = "2021"

[lib]
name = "marktext_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-fs = "2"
tauri-plugin-window-state = "2"
tauri-plugin-process = "2"
tauri-plugin-os = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-updater = "2"

# Font enumeration
font-kit = "0.14"

# File watching
notify = "7"

# Async runtime
tokio = { version = "1", features = ["full"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Error handling
thiserror = "2"
anyhow = "1"

# System info
hostname = "0.4"
dirs = "5"

# URL encoding
urlencoding = "2"

# Trash / recycle bin
trash = "5"

# CLI argument parsing
clap = { version = "4", features = ["derive"] }

# Secure credential storage
keyring = "3"

# Logging
log = "0.4"
env_logger = "0.11"

# Platform-specific
[target.'cfg(windows)'.dependencies]
winapi = { version = "0.3", features = ["winuser"] }

[features]
default = []
custom-protocol = ["tauri/custom-protocol"]

# Dev profile: optimize dependencies for faster runtime without slowing down recompiles
[profile.dev]
opt-level = 0            # No optimization for your code (fast compile)

[profile.dev.package."*"]
opt-level = 2            # Optimize dependencies (they rarely change, so this is cached)

# Release profile: good balance between build speed and binary quality
[profile.release]
panic = "abort"
codegen-units = 16       # Parallel codegen (default); was 1 which serializes everything
lto = "thin"             # Thin LTO: ~80% of full LTO benefit at ~30% of the build time
opt-level = "s"          # Optimize for size
strip = true

# Optional: use this profile for final distribution builds (slower but smaller)
# Run with: cargo build --profile release-dist
[profile.release-dist]
inherits = "release"
codegen-units = 1        # Maximum optimization (slow!)
lto = true               # Full LTO (slow!)
