name: Build Windows

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: "构建类型"
        required: true
        default: "installer"
        type: choice
        options:
          - installer
          - binary
          - portable
      skip_tests:
        description: "跳过测试"
        required: false
        default: false
        type: boolean
      is_stable:
        description: "标记为稳定版本"
        required: false
        default: false
        type: boolean

  push:
    branches:
      - "build-windows"
      - "build-win-*"
    paths-ignore:
      - "docs/**"
      - "*.md"

jobs:
  build-windows:
    runs-on: windows-latest
    continue-on-error: false
    timeout-minutes: 60

    env:
      MARKTEXT_IS_STABLE: ${{ github.event.inputs.is_stable == 'true' && '1' || '' }}
      MARKTEXT_EXIT_ON_ERROR: 1
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Rust
        uses: dtolnay/rust-toolchain@stable

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: 缓存 node_modules
        uses: actions/cache@v4
        id: cacheNodeModules
        with:
          path: ${{ github.workspace }}\node_modules
          key: ${{ runner.os }}-node_modules-v4-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node_modules-v4-

      - name: 缓存 Rust
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: 安装依赖
        if: steps.cacheNodeModules.outputs.cache-hit != 'true'
        run: npm ci

      - name: 代码检查
        run: |
          npm run lint
          npm run validate-licenses

      - name: 运行测试
        if: ${{ github.event.inputs.skip_tests != 'true' }}
        run: npm run test

      - name: 构建 - 仅二进制
        if: ${{ github.event.inputs.build_type == 'binary' }}
        run: npm run build:portable-release

      - name: 构建 - 便携版
        if: ${{ github.event.inputs.build_type == 'portable' }}
        run: npm run build:portable-release

      - name: 构建 - 完整安装包
        if: ${{ github.event.inputs.build_type == 'installer' || github.event.inputs.build_type == '' }}
        run: npm run build:installer-release

      - name: 上传二进制文件
        if: ${{ github.event.inputs.build_type == 'binary' || github.event.inputs.build_type == 'portable' }}
        uses: actions/upload-artifact@v4
        with:
          name: marktext-win-exe
          path: src-tauri/target/release/marktext.exe
          if-no-files-found: warn
          retention-days: 30

      - name: 上传安装包
        if: ${{ github.event.inputs.build_type == 'installer' || github.event.inputs.build_type == '' }}
        uses: actions/upload-artifact@v4
        with:
          name: marktext-installer-bundle
          path: src-tauri/target/release/bundle/
          if-no-files-found: warn
          retention-days: 30

      - name: 计算校验和
        run: |
          Write-Host "=== SHA256 Checksums ===" -ForegroundColor Green
          if (Test-Path "src-tauri\target\release\marktext.exe") {
            $hash = (Get-FileHash -Algorithm SHA256 "src-tauri\target\release\marktext.exe").Hash
            Write-Host "$hash  marktext.exe"
          }
          Get-ChildItem -Path "src-tauri\target\release\bundle" -Recurse -Include "*.exe","*.msi" -ErrorAction SilentlyContinue | ForEach-Object {
            $hash = (Get-FileHash -Algorithm SHA256 $_.FullName).Hash
            Write-Host "$hash  $($_.Name)"
          }
        shell: pwsh
